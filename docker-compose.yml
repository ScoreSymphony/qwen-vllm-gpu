services:
  vllm:
    image: vllm/vllm-openai:v0.28.0-ubuntu2404
    container_name: scoresymphony-qwen-vllm
    restart: unless-stopped
    gpus: all
    ipc: host
    stop_grace_period: 60s

    volumes:
      - ${QWEN_MODEL_PATH:-/models/Qwen3-Coder-Next-FP8}:/model:ro
      - vllm-cache:/root/.cache/vllm

    ports:
      - "127.0.0.1:8000:8000"

    command:
      - --model
      - /model
      - --served-model-name
      - Qwen3-Coder-Next-FP8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 120s

volumes:
  vllm-cache:
