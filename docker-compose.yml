services:
  vllm:
    image: vllm/vllm-openai:v0.28.0-cu129-ubuntu2404
    container_name: scoresymphony-qwen-vllm
    restart: unless-stopped
    ipc: host
    stop_grace_period: 60s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm

    ports:
      - "127.0.0.1:8000:8000"

    command:
      - --model
      - Qwen/Qwen3-Coder-Next-FP8
      - --revision
      - da6e2ed27304dd39abadd9c82ef50e8de67bdd4c
      - --served-model-name
      - Qwen3-Coder-Next-FP8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 180s

volumes:
  hf-cache:
  vllm-cache:
